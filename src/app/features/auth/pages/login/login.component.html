<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Iniciar sesión</h1>
      <p>Accede a tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
            id="email"
            type="email"
            formControlName="email"
            class="auth-input"
            placeholder="Ingresa tu correo"
            autocomplete="email"
        />

        <small class="error-text" *ngIf="email.touched && email.hasError('required')">
             El correo es obligatorio.
        </small>

        <small class="error-text" *ngIf="email.touched && email.hasError('email')">
            Ingresa un correo válido.
        </small>
        </div>

<div class="form-group">
  <label for="password">Contraseña</label>
  <input
    id="password"
    type="password"
    formControlName="password"
    class="auth-input"
    placeholder="Ingresa tu contraseña"
    autocomplete="current-password"
  />

  <small class="error-text" *ngIf="password.touched && password.hasError('required')">
    La contraseña es obligatoria.
  </small>

  <small class="error-text" *ngIf="password.touched && password.hasError('minlength')">
    La contraseña debe tener al menos 6 caracteres.
  </small>
</div>

      <div class="message error-box" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="message success-box" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading">
        {{ isLoading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>

    <div class="auth-footer">
  <div><a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a></div>
  <div>
    <span>¿No tienes cuenta?</span>
    <a routerLink="/register">Crear cuenta</a>
  </div>
</div>
</div>
