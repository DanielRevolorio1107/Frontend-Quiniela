<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Ingresa tu correo para recibir instrucciones de recuperación</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="auth-input"
          placeholder="Ingresa tu correo"
          autocomplete="email"
        />

        <small class="error-text" *ngIf="email.touched && email.hasError('required')">
          El correo es obligatorio.
        </small>

        <small class="error-text" *ngIf="email.touched && email.hasError('email')">
          Ingresa un correo válido.
        </small>
      </div>

      <div class="message error-box" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="message success-box" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar instrucciones' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Volver a iniciar sesión</a>
    </div>
  </div>
</div>
