<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu nueva contraseña</p>
    </div>

    <form [formGroup]="recoverPasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="newPassword">Nueva contraseña</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          class="auth-input"
          placeholder="Ingresa tu nueva contraseña"
          autocomplete="new-password"
        />

        <small class="error-text" *ngIf="newPassword.touched && newPassword.hasError('required')">
          La nueva contraseña es obligatoria.
        </small>

        <small class="error-text" *ngIf="newPassword.touched && newPassword.hasError('minlength')">
          La contraseña debe tener al menos 8 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="auth-input"
          placeholder="Confirma tu nueva contraseña"
          autocomplete="new-password"
        />

        <small class="error-text" *ngIf="confirmPassword.touched && confirmPassword.hasError('required')">
          Debes confirmar la contraseña.
        </small>

        <small class="error-text" *ngIf="confirmPassword.touched && recoverPasswordForm.hasError('passwordMismatch')">
          Las contraseñas no coinciden.
        </small>
      </div>

      <div class="message error-box" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="message success-box" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-auth" [disabled]="isLoading || !token">
        {{ isLoading ? 'Actualizando...' : 'Actualizar contraseña' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" (click)="goToLogin()">Volver a iniciar sesión</a>
    </div>
  </div>
</div>
