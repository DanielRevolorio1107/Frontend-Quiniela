<div class="pred-page">
  <div class="pred-card">
    <div class="top-bar">
      <a routerLink="/partidos" class="btn-secondary">← Volver a partidos</a>
    </div>

    <div *ngIf="errorMessage" class="message error-box">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success-box">
      {{ successMessage }}
    </div>

    <section *ngIf="isLoadingPartido" class="info-box">
      Cargando información del partido...
    </section>

    <section *ngIf="!isLoadingPartido && partido" class="match-summary">
      <h1>Registrar predicción</h1>
      <p class="match-title">{{ getEquipoLocal() }} vs {{ getEquipoVisitante() }}</p>
      <p><strong>Fecha:</strong> {{ getFecha() }}</p>
    </section>

    <form [formGroup]="predictionForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="ligaId">Liga</label>
        <select id="ligaId" formControlName="ligaId" class="pred-input">
          <option value="">Selecciona una liga</option>
          <option *ngFor="let liga of ligas" [value]="liga.id">
            {{ liga.nombre }}
          </option>
        </select>

        <small class="error-text" *ngIf="ligaId.touched && ligaId.hasError('required')">
          Debes seleccionar una liga.
        </small>
      </div>

      <div class="score-grid">
        <div class="form-group">
          <label for="golesLocal">Goles local</label>
          <input
            id="golesLocal"
            type="number"
            formControlName="golesLocal"
            class="pred-input"
            min="0"
          />

          <small class="error-text" *ngIf="golesLocal.touched && golesLocal.hasError('required')">
            El marcador local es obligatorio.
          </small>
        </div>

        <div class="form-group">
          <label for="golesVisitante">Goles visitante</label>
          <input
            id="golesVisitante"
            type="number"
            formControlName="golesVisitante"
            class="pred-input"
            min="0"
          />

          <small class="error-text" *ngIf="golesVisitante.touched && golesVisitante.hasError('required')">
            El marcador visitante es obligatorio.
          </small>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting || isLoadingLigas">
        {{ isSubmitting ? 'Guardando...' : 'Guardar predicción' }}
      </button>
    </form>
  </div>
</div>
